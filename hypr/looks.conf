general {
    gaps_in = 2
    gaps_out = 4

    border_size = 1

    col.inactive_border = rgba(6b412fff)
    col.active_border = rgba(99b1b5ff)

    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2

    # 1.0 avoids forcing every active window through the opacity path
    active_opacity = 1.0
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
    }
}
